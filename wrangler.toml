name = "my-wedding-project"
compatibility_date = "2026-08-11"
main = "worker.js"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/invite/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[vars]
FIREBASE_PROJECT_ID = "my-wedding-project-11aec"
FIREBASE_DATABASE_ID = "(default)"
WISHES_COLLECTION = "wishes"
GUESTS_COLLECTION = "guests"
SONG_SUGGESTIONS_COLLECTION = "songSuggestions"
PHOTOS_COLLECTION = "photoSubmissions"
GOOGLE_SHEETS_RANGE = "Wishes!A:G"
GOOGLE_SONGS_RANGE = "Song Suggestions!A:G"
GOOGLE_PHOTOS_RANGE = "Photo Index!A:J"
MAX_WISHES = "40"
WEDDING_DAY_START = "2026-10-20T00:00:00+07:00"
WEDDING_DAY_END = "2026-10-21T06:00:00+07:00"

# Ảnh dung lượng lớn nằm ở R2; Firestore chỉ giữ metadata và trạng thái duyệt.
[[r2_buckets]]
binding = "PHOTO_BUCKET"
bucket_name = "my-wedding-photos"

# Rate limit dùng KV theo cửa sổ thời gian; không lưu IP thô.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "aaf58c03b5ca460fbad818fe4bc4cb86"
